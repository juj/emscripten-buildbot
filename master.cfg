class EmscriptenBuildStepLineObserver(util.LogLineObserver):
    prev_line = ''
    lines = ''
    test_ok_result_pattern = re.compile(r'^.+? \(.+?\) \.\.\. ok \([\d.]+s\)$')
    passed_tests = 0
    first_failed_test_name = None

    def outLineReceived(self, line):
        self.lines += line + '\n'

        if self.test_ok_result_pattern.fullmatch(line):
            self.passed_tests += 1
            self.step.setProgress('tests', self.passed_tests)
        elif self.first_failed_test_name == None and self.prev_line == '======================================================================' and (line.startswith('FAIL:') or line.startswith('ERROR:')):
            self.first_failed_test_name = line.split(' ')[1]
        self.prev_line = line

    def errLineReceived(self, line):
        self.outLineReceived(line)

# Override the ShellCommand step to provide a custom summary line after a test is run.
# This way the # of failed and skipped tests is visualized more readily in the status line.
class EmscriptenTestRunStep(steps.ShellCommand):
    def __init__(self, *args, **kwargs):
        super().__init__(*args, **kwargs)
        self.mode = self.name.split(' ')[-1]
        self.observer = EmscriptenBuildStepLineObserver()
        self.addLogObserver('stdio', self.observer)
        self.progressMetrics += ('tests',)
        self._warnings_log_added = False

    def find_num_failures(self, text):
        end = text.rfind('----------------------------------------------------------------------')
        if end < 0:
            return 0
        text = text[end:]

        failures = re.search(r'(?<!expected )failures=(\d+)', text)
        errors = re.search(r'errors=(\d+)', text)
        return (int(failures.group(1)) if failures else 0) + (int(errors.group(1)) if errors else 0)

    def find_warnings(self, text):
        # Find all occurrences of WARNING and capture up to newline or 30 chars
        warnings = []
        for m in re.finditer(r'WARNING([^\n]{0,50})', text):
            text = m.group(0)
            ignored_warnings = [
                'falling back to java version',
                'EMTEST_RESTART_BROWSER_EVER',
                'WARNING: This will modify ',
                'WARNING: Not testing engine ',
                'Unable to connect to ibus', # Firefox spams
                'Connection reset by peer', # emrun/sockets suite spam?
                'you are using the obsolete', # test_benchmark native make warnings: http://localhost:8010/api/v2/logs/397958/raw_inline
                'is missing on your system', # test_benchmark native make warnings: http://localhost:8010/api/v2/logs/397958/raw_inline
                'FileDescriptorSet destroyed', # Firefox spams http://localhost:8010/api/v2/logs/397925/raw_inline
                'vsnprintf() not found, falling back', # zlib configure spams this warning: http://localhost:8010/api/v2/logs/399286/raw_inline
                ]
            def str_contains_any_ignored_warning(test_str):
                for w in ignored_warnings:
                    if w in test_str:
                        return True
            if text not in warnings and not str_contains_any_ignored_warning(text):
                warnings.append(text)  # 'text' includes "WARNING" + trailing text
        if len(warnings) > 0:
            return warnings

        return list(set(re.findall(r'Retrying flaky test "([^"]+)"', text)))

    def getResultSummary(self):
        match = re.search(
            r'Ran \d+ tests? in [\d.]+s\s+'
            r'(OK|FAILED)'
            r'(?: \((?:failures=(\d+), )?skipped=(\d+)\))?',
            self.observer.lines
        )
        fatal_error = 'FATAL' in self.observer.lines

        if match and not fatal_error:
            results = []
            failures = self.find_num_failures(self.observer.lines)
            if failures:
                results += [f'failures={failures}']
            if self.observer.passed_tests: results += [f'passed={self.observer.passed_tests}']
            if match.group(3): results += [f'skipped={match.group(3)}']
            result_line = ', '.join(results)

            if failures > 0:
                summary_text = f"FAIL:{self.mode}.{self.observer.first_failed_test_name}"
                if failures > 1:
                    summary_text += f' (+{failures-1} more)'
            else:
                summary_text = f"{self.mode}: {match.group(1)} ({result_line})"

            fail_text = ''
            if failures > 0:
                if self.observer.first_failed_test_name:
                    fail_text = f"FAIL:{self.mode}.{self.observer.first_failed_test_name}"
                    if failures > 1:
                        fail_text += f' (+{failures-1} more)'
                else:
                    fail_text = f"{self.mode}({failures})"
        else:
            summary_text = f"{self.mode}: FATAL ERROR"
            fail_text = f"FATAL:{self.mode}"

        if len(fail_text) == 0:
            warnings = self.find_warnings(self.observer.lines)
            if len(warnings) > 0:
                if not self._warnings_log_added:
                    self.addCompleteLog('warnings', '\n'.join(warnings))
                    self._warnings_log_added = True
                self.results = WARNINGS # Show this build step as orange with warnings
                return {
                    "step": ' '.join([f'FLAKY:{x}' for x in warnings]),
                    "build": ' '.join([f'FLAKY:{x}' for x in warnings])
                }

        return {
            "step": summary_text,
            "build": fail_text
        }

# The 'builders' list defines the Builders, which tell Buildbot how to perform a build:
