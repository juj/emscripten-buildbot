            active_node = 'nightly'
            factory.addStep(steps.ShellCommand(name='emsdk activate nightly Node.js', command=[emsdk_cmd, "activate", "node-nightly-64bit"] + emsdk_args + juj_override, haltOnFailure=True))

        if mode not in nightly_node_test_suites and active_node != 'default':
            active_node = 'default'
            factory.addStep(steps.ShellCommand(name='emsdk activate Node.js 22.16.0', command=[emsdk_cmd, "activate", "node-22.16.0-64bit"] + emsdk_args + juj_override, haltOnFailure=True))

        if mode.startswith('bigendian') and active_node[1] != 'bigendian':
            active_node = [active_node, 'bigendian']
            factory.addStep(steps.ShellCommand(name='emsdk activate big endian s390x Node.js', command=[emsdk_cmd, "activate", "node-22.16.0-64bit", "node-big-endian-crosscompile-24.19.0-64bit"] + emsdk_args + juj_override, haltOnFailure=True, hideStepIf=lambda results, s: results==SUCCESS))

#        if mode == 'sockets':
#            factory.addStep(steps.ShellCommand(name='npm install', command=["npm", "install"], haltOnFailure=True))
#            factory.addStep(steps.ShellCommand(name='bootstrap', command=["./bootstrap"], haltOnFailure=True))

        noncritical_test_suites = ['codesize']
        failure_is_warning = mode in noncritical_test_suites

        def deactivate_previous_browser():
            nonlocal emsdk_activated_browser
            if emsdk_activated_browser:
                factory.addStep(steps.ShellCommand(name=f'emsdk deactivate {emsdk_activated_browser}', command=[emsdk_cmd, "deactivate", emsdk_activated_browser] + emsdk_args + juj_override,
                                                   warnOnFailure=True, flunkOnFailure=False, hideStepIf=lambda results, s: results==SUCCESS))
                emsdk_activated_browser = None

        if mode in browser_test_suites:
            for b in tested_browsers:
                cur_env = env.copy()
                if 'EMCC_CFLAGS' not in cur_env: cur_env['EMCC_CFLAGS'] = ''
                cur_cmd = cmd

#                cur_env['EMCC_CFLAGS'] += ' -sSTACK_OVERFLOW_CHECK=2 '

                if get_firefox_version(b) is not None:
                    cur_env['EMCC_CFLAGS'] += f' -sMIN_FIREFOX_VERSION={get_firefox_version(b)} -Wno-unused-command-line-argument '
                    if get_firefox_version(b) < 129 and '64' in mode: continue # Wasm64 support appeared in Firefox 129.
                    #if get_firefox_version(b) < 76: cur_env['EMTEST_LACKS_SOUND_HARDWARE'] = '1'
                    # Audio Worklet was introduced in Firefox 76, but Emscripten impl. of AW requires SAB. SAB was added in Firefox 79
                    if get_firefox_version(b) < 79: cur_cmd += f' skip:{mode}.test_*thread* skip:{mode}.test_*wasm_worker* skip:{mode}.test_*audio_worklet* '
                    if get_firefox_version(b) < 79: cur_env['EMCC_CFLAGS'] += f' -mno-bulk-memory -mno-bulk-memory-opt ' # FF 79 introduced bulk memory support
                    if get_firefox_version(b) < 100: cur_env['EMTEST_SKIP_WASM_LEGACY_EH'] = '1'
                    if get_firefox_version(b) < 105: cur_env['EMTEST_LACKS_OFFSCREEN_CANVAS'] = '1' # OffscreenCanvas was introduced in Firefox 105
                    if get_firefox_version(b) < 114: cur_env['EMTEST_LACKS_ES6_WORKERS'] = '1' # ES6 Module Workers was introduced in Firefox 114
                    if get_firefox_version(b) < 131: cur_env['EMTEST_SKIP_WASM_EH'] = '1' # Wasm Exnref exception handling

                    # Firefox on Windows runs out of memory in multithreaded tests. https://bugzil.la/1992558
                    if os == 'win' and get_firefox_version(b) < 102 and mode in ['browser_2gb', 'browser64', 'browser64_4gb', 'browser64_2gb']:
                        cur_cmd += f' skip:{mode}.test_*thread* skip:{mode}.test_*wasm_worker* skip:{mode}.test_fs_idbfs_* skip:{mode}.test_fs_lz4fs_package skip:{mode}.test_system '

#                    if get_firefox_version(b) < 140 and os == 'linux' and arch == 'arm64': continue # Firefox 140 ESR is the first with linux-aarch64 binaries

#                    if get_firefox_version(b) < 105:
#                        if 'EMTEST_CORES' not in cur_env:
#                            cur_env['EMTEST_CORES'] = '1'
#                        elif int(cur_env['EMTEST_CORES']) > 8:
#                            cur_env['EMTEST_CORES'] = '8'

                    if get_firefox_version(b) < 67:
                        cur_env['EMTEST_CORES'] = '1' # Cannot use parallel browser test runner due to two bugs: opens -profile as URL if another FF instance is open, and killing Firefox kills them all.

                if 'latest-beta' in b and 'browser' in mode:
                    cur_env['EMCC_CFLAGS'] += ' -sMIN_SAFARI_VERSION=-1 -sMIN_CHROME_VERSION=-1 -sMIN_NODE_VERSION=-1 -Wno-unused-command-line-argument '
                    cur_cmd += f' skip:{mode}.test_hello_world_worker* ' # https://github.com/emscripten-core/emscripten/pull/25473

                if os == 'win' and 'firefox' in b and mode in ['browser_2gb', 'browser64', 'browser64_4gb', 'browser64_2gb']:
                    # https://bugzil.la/1992558
                    cur_env['EMTEST_RESTART_BROWSER_EVERY_N_TESTS'] = '20'

                if 'firefox' in b or 'chrome' in b:
                    factory.addStep(steps.ShellCommand(name=f'emsdk activate {b}', command=[emsdk_cmd, "activate", b] + emsdk_args + juj_override, haltOnFailure=True, hideStepIf=lambda results, s: results==SUCCESS))
                    emsdk_activated_browser = b
    
                if 'Safari' in b:
                    deactivate_previous_browser()
                    cur_env['EMTEST_BROWSER'] = b
                    cur_env['EMTEST_LACKS_OFFSCREEN_CANVAS'] = '1'
                    cur_env['EMTEST_LACKS_WEBGPU'] = '1'
                    cur_env['EMTEST_LACKS_SOUND_HARDWARE'] = '1'
                    cur_env['EMTEST_LACKS_GROWABLE_ARRAYBUFFERS'] = '1'
                    cur_cmd += f' skip:{mode}.test_fs_idbfs_sync_autopersist ' # Flaky to fault on mac15.5 x64
                    cur_cmd += f' skip:{mode}.test_preload_caching_indexeddb_name ' # Flaky to fault on mac15.5 x64 and macOS 26 Tahoe
                    cur_cmd += f' skip:{mode}.test_cubegeom_proxied ' # Flaky to fault on mac12.7.6 x64
                    if '64' in mode: continue # Wasm64 support not available in Safari.

                b_name = b.replace('-64bit', '') # Appease Buildbot max 50 chars build step limit
                b_name = b_name.replace('/Applications/Safari.app', 'Safari') # Appease Buildbot max 50 chars build step limit
                factory.addStep(EmscriptenTestRunStep(name=f'Test {i}/{num_tests_to_run} {b_name}/{mode}',
                                command=sanitize_cmdline(cur_cmd),
                                haltOnFailure=False,
                                warnOnWarnings=True,
                                warnOnFailure=failure_is_warning,
                                flunkOnFailure=not failure_is_warning,
        #                           timeout=minutes(60),
                                env=cur_env))
                deactivate_previous_browser()
                i += 1

        else:
            if active_node != 'nightly':
                env['EMTEST_SKIP_WASM_EH'] = '1' # Wasm Exnref exception handling

            factory.addStep(EmscriptenTestRunStep(name=f'Test {i}/{num_tests_to_run} {mode}',
                            command=sanitize_cmdline(cmd),
                            haltOnFailure=False,
                            warnOnWarnings=True,
                            warnOnFailure=failure_is_warning,
                            flunkOnFailure=not failure_is_warning,
    #                           timeout=minutes(60),
                            env=env))
            i += 1

        if mode.startswith('bigendian') and active_node[1] == 'bigendian':
            active_node = active_node[0]
            factory.addStep(steps.ShellCommand(name='emsdk deactivate big endian s390x Node.js', command=[emsdk_cmd, "deactivate", "node-big-endian-crosscompile-24.19.0-64bit"] + emsdk_args + juj_override,
                                               warnOnFailure=True, flunkOnFailure=False, hideStepIf=lambda results, s: results==SUCCESS))


    i = 1
    # Binaryen tests
    suites = ['version', 'wasm-opt', 'wasm-dis', 'crash', 'dylink', 'ctor-eval', 'wasm-metadce', 'wasm-reduce', 'spec', 'lld',
              'wasm2js', 'validator', 'example', 'unit', 'binaryenjs', 'binaryenjs_wasm', 'lit', 'gtest']
    for suite in suites:
        if os == 'win':
            cmd = f"emsdk_env && cd binaryen/main && %EMSDK_PYTHON% check.py {suite}"
        else:
            cmd = f"source ./emsdk_env.sh; cd binaryen/main; $EMSDK_PYTHON check.py {suite}"
        continue # XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
        factory.addStep(steps.ShellCommand(name=f'Binaryen test {i}/{len(suites)} {suite}',
                        command=cmd,
                        haltOnFailure=False,
                        warnOnWarnings=True,
#                        timeout=minutes(60),
                        env=env))
        i += 1

    add_temp_cleanup_command()

    return factory        

